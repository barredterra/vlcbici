<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>vlcbici – bike sharing routes for Valencia</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="map"></div>

    <aside id="panel">
      <header id="panel-header">
        <h1>vlc<span>bici</span></h1>
        <button id="toggle-panel" type="button" aria-expanded="true">
          Hide
        </button>
      </header>

      <div id="panel-body">
        <form id="route-form">
          <label for="start-input"
            ><span class="ab-badge" aria-hidden="true">A</span>Start</label
          >
          <div class="row">
            <input
              id="start-input"
              type="text"
              placeholder="Address or click the map"
              autocomplete="off"
            />
            <button id="locate-button" type="button" title="Use my location">
              My location
            </button>
          </div>

          <label for="dest-input"
            ><span class="ab-badge dest" aria-hidden="true">B</span
            >Destination</label
          >
          <input
            id="dest-input"
            type="text"
            placeholder="Address or click the map"
            autocomplete="off"
          />

          <p class="hint">
            Map clicks fill the empty field: start first, then destination.
          </p>

          <div class="row">
            <button id="plan-button" type="submit">Plan route</button>
            <button id="clear-button" type="button" class="secondary">
              Clear
            </button>
          </div>
        </form>

        <div id="message" role="status"></div>
        <div id="summary"></div>

        <!-- Same colours as stationColour() in app.js. -->
        <ul class="station-legend" aria-label="Station colours">
          <li style="--dot: #16a34a">Bikes and docks</li>
          <li style="--dot: #ea580c">Few docks</li>
          <li style="--dot: #eab308">Few bikes</li>
          <li style="--dot: #dc2626">Few of both</li>
          <li style="--dot: #9ca3af">Closed or no data</li>
        </ul>

        <p class="disclaimer">
          Unofficial app. Not affiliated with Valenbisi, JCDecaux or the City of
          Valencia. Station data can be out of date.
        </p>
      </div>
    </aside>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="app.js"></script>
  </body>
</html>
